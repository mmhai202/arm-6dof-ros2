frame: base_footprint
camera:
  position: [0.50, 0.20, 1.12]
  rpy: [0.0, 1.5707963267948966, 0.0]
  width: 320
  height: 240
  horizontal_fov: 1.12
  # Sample in simulation time fast enough to supply a 10 Hz wall-time preview
  # while physics runs slower than real time. The detector keeps the newest frame.
  update_rate: 20
  near: 0.05
  far: 3.0
mount:
  # Keep the stand and camera on X=0.50. The rear of the downward-facing
  # housing is Z=1.185; a plate and short drop connect it to the crossbar.
  - name: factory_foot
    center: [0.50, 0.66, 0.015]
    size: [0.13, 0.13, 0.03]
  - name: factory_mast
    center: [0.50, 0.66, 0.635]
    size: [0.035, 0.035, 1.21]
  - name: factory_crossbar
    center: [0.50, 0.43, 1.2225]
    size: [0.035, 0.495, 0.035]
  - name: factory_camera_drop
    center: [0.50, 0.20, 1.197]
    size: [0.020, 0.020, 0.016]
  - name: factory_camera_plate
    center: [0.50, 0.20, 1.187]
    size: [0.040, 0.060, 0.004]
detection:
  object_size: [0.06, 0.04, 0.04]
  min_pixels: 35
  extent_min_ratio: 0.65
  extent_max_ratio: 1.20
  min_top_area_ratio: 0.65
  # Restrict detections to the picking deck; factory paint is not stock.
  workspace_min: [0.37, -0.005, 0.425]
  workspace_max: [0.63, 0.405, 0.455]
  colors:
    red:
      hsv_lower: [0, 170, 70]
      hsv_upper: [10, 255, 255]
    blue:
      hsv_lower: [100, 150, 60]
      hsv_upper: [125, 255, 255]
    green:
      hsv_lower: [40, 130, 60]
      hsv_upper: [85, 255, 255]
