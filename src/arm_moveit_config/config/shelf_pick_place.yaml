# A 60 mm payload leaves room to squeeze before the gripper's 40 mm mechanical stop.
frame: base_footprint
shelf:
  center_xy: [0.52, 0.25]
  size_xy: [0.36, 0.50]
  surface_z: 0.42
  top_z: 0.95
  thickness: 0.02
object:
  size: [0.06, 0.04, 0.04]
  center_xy: [0.43, 0.25]
box:
  center_xy: [-0.45, -0.25]
  size_xy: [0.28, 0.28]
  height: 0.18
  thickness: 0.015
motion:
  gripper_open: 0.025
  tcp_gap: 0.03
  approach: 0.10
  lift: 0.14
  withdraw_clearance: 0.30
  transfer_z: 0.55
  place_clearance: 0.025
  velocity_scale: 0.50
  acceleration_scale: 0.50
  cartesian_step: 0.005
  planning_time: 10.0
physics:
  mass: 0.10
  # Match the finger surfaces; ODE uses the lower coefficient of the contact pair.
  friction: 2.0
  grip_compression: 0.006
  min_contact_force: 0.2
  max_grasp_drift: 0.018
  contact_timeout: 0.5
  settle_time: 1.5
  placement_hold_time: 0.4
  placement_timeout: 8.0
  placement_linear_speed: 0.01
  placement_angular_speed: 0.1
