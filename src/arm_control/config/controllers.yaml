# Effort feedback keeps gravity, inertia and contact forces in the simulation.
# Gains are approximate and must be retuned for a different tool or payload.
controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    gains:
      joint_1: {p: 1000.0, i: 100.0, d: 6.0, i_clamp: 80.0, ff_velocity_scale: 0.0}
      joint_2: {p: 3000.0, i: 600.0, d: 30.0, i_clamp: 80.0, ff_velocity_scale: 0.0}
      joint_3: {p: 2500.0, i: 400.0, d: 10.0, i_clamp: 50.0, ff_velocity_scale: 0.0}
      joint_4: {p: 250.0, i: 50.0, d: 0.7, i_clamp: 10.0, ff_velocity_scale: 0.0}
      joint_5: {p: 200.0, i: 40.0, d: 0.7, i_clamp: 10.0, ff_velocity_scale: 0.0}
      joint_6: {p: 100.0, i: 20.0, d: 0.2, i_clamp: 5.0, ff_velocity_scale: 0.0}
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
      joint_1: {trajectory: 0.15, goal: 0.02}
      joint_2: {trajectory: 0.15, goal: 0.02}
      joint_3: {trajectory: 0.15, goal: 0.02}
      joint_4: {trajectory: 0.15, goal: 0.02}
      joint_5: {trajectory: 0.15, goal: 0.02}
      joint_6: {trajectory: 0.15, goal: 0.02}

gripper_controller:
  ros__parameters:
    joints: [finger_left_joint, finger_right_joint]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    gains:
      finger_left_joint: {p: 3000.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      finger_right_joint: {p: 3000.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.02
      finger_left_joint: {goal: 0.002}
      finger_right_joint: {goal: 0.002}
